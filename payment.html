<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="payment.css">
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  Please Enter Your Email and Mobile Number.
  <span>Unlock 300TB+ Premium Digital Gold All Mega Bundle – for Just ₹1</span>
</div>

<!-- PAYMENT BOX -->
<div class="payment-wrapper" id="paymentBox">

  <!-- STEPS -->
  <div class="steps">
    <div class="step done">1 CONTACT<br><small>Information</small></div>
    <div class="step active">2 PAYMENT<br><small>Your Order</small></div>
  </div>

  <h3>Pay once for lifetime access</h3>

  <!-- ORDER SUMMARY -->
  <div class="order-box">
    <div class="order-row">
      <span>All In One Bundle</span>
      <span>₹1.00</span>
    </div>
  </div>

  <!-- PAYMENT METHOD -->
  <div class="payment-method">
    <input type="radio" checked disabled>
    <label>UPI Payment</label>
  </div>

  <!-- PAY BUTTON -->
  <button
    type="button"
    class="pay-btn"
    id="payBtn"
    onclick="payNow()">
    Pay ₹1
    <small>Price Increasing Soon !!</small>
  </button>

  <p class="secure">🔒 100% Secure and Safe Payments</p>

</div>

<noscript>
  <p style="color:red;text-align:center;">
    JavaScript is required to complete payment.
  </p>
</noscript>

<!-- LOAD JS AT END -->
<script src="payment.js"></script>
</body>
</html>
