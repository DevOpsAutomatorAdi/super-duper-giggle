<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="payment.css">
</head>
<body>

<!-- TOP BLUE BAR -->
<div class="top-bar">
  Please Enter Your Email and Mobile Number.
  <span>Unlock 300TB+ Premium Digital Gold All Mega Bundle – for Just ₹19</span>
</div>

<!-- PAYMENT BOX -->
<div class="payment-wrapper">

  <!-- STEPS -->
  <div class="steps">
    <div class="step done">1 CONTACT<br><small>Information</small></div>
    <div class="step active">2 PAYMENT<br><small>Your Order</small></div>
  </div>

  <h3>Pay once for life time access</h3>

  <!-- ORDER SUMMARY -->
  <div class="order-box">
    <div class="order-row">
      <span>All In One Bundle</span>
      <span>₹19.00</span>
    </div>
  </div>

  <!-- PAYMENT METHOD -->
  <div class="payment-method">
    <input type="radio" checked>
    <label>UPI Payment</label>
  </div>

  <!-- PAY BUTTON -->
  <button class="pay-btn" onclick="payNow()">
    Pay ₹19
    <small>Price Increasing Soon !!</small>
  </button>

  <p class="secure">🔒 100% Secure and Safe Payments</p>

</div>

<script src="payment.js"></script>
</body>
</html>
